<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Web IDE</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/css/xterm.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */

    .topbar {
      height: 54px;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      overflow-x: auto;
      white-space: nowrap;
    }

    .topbar::-webkit-scrollbar {
      height: 5px;
    }

    .topbar::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 10px;
    }

    .brand {
      font-weight: bold;
      margin-right: 8px;
      color: #58a6ff;
      flex-shrink: 0;
    }

    button {
      border: 1px solid #30363d;
      background: #21262d;
      color: #ddd;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
    }

    button:hover {
      background: #30363d;
    }

    .run {
      background: #238636;
      border-color: #238636;
      color: white;
    }

    .stop {
      background: #da3633;
      border-color: #da3633;
      color: white;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .terminal-title {
      height: 34px;
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      color: #aaa;
      font-size: 13px;
    }

    #terminal {
      flex: 1;
      min-height: 0;
      padding: 8px;
      background: #0d1117;
    }

    .preview {
      height: 40%;
      min-height: 150px;
      border-top: 1px solid #30363d;
      background: white;
      display: none;
      flex-direction: column;
    }

    .preview-head {
      height: 35px;
      min-height: 35px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      background: #161b22;
      color: #ccc;
      font-size: 13px;
    }

    #previewFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .status {
      color: #8b949e;
      margin-left: auto;
      padding-left: 10px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="topbar">

    <div class="brand">WEB IDE</div>

    <button onclick="sendCommand('npm create vite@latest')">
      npm create vite
    </button>

    <button onclick="sendCommand('npm install')">
      npm install
    </button>

    <button onclick="sendCommand('npm install express')">
      Express
    </button>

    <button onclick="sendCommand('npm install mongoose')">
      Mongoose
    </button>

    <button onclick="sendCommand('npm install cors')">
      CORS
    </button>

    <button onclick="sendCommand('npm install dotenv')">
      dotenv
    </button>

    <button onclick="sendCommand('npm install react react-dom')">
      React
    </button>

    <button onclick="sendCommand('npm install -D vite')">
      Vite
    </button>

    <button onclick="sendCommand('npm install tailwindcss @tailwindcss/vite')">
      Tailwind
    </button>

    <button onclick="sendCommand('npm list')">
      npm list
    </button>

    <button onclick="sendCommand('node -v')">
      node -v
    </button>

    <button onclick="sendCommand('npm -v')">
      npm -v
    </button>

    <button onclick="sendCommand('pwd')">
      pwd
    </button>

    <button onclick="sendCommand('ls')">
      ls
    </button>

    <button class="run" onclick="sendCommand('npm run dev')">
      ▶ npm run dev
    </button>

    <button class="stop" onclick="sendCtrlC()">
      ■ Stop
    </button>

    <button onclick="togglePreview()">
      Preview
    </button>

    <div class="status" id="status">
      Starting...
    </div>

  </div>

  <div class="main">

    <div class="terminal-title">
      Terminal — WebContainer
    </div>

    <div id="terminal"></div>

    <div class="preview" id="preview">
      <div class="preview-head">
        Live Preview
      </div>

      <iframe
        id="previewFrame"
        allow="cross-origin-isolated"
      ></iframe>
    </div>

  </div>

</div>


<script type="module">

  import { WebContainer }
    from "https://unpkg.com/@webcontainer/api@1.6.4/dist/index.js";

  import { Terminal }
    from "https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/+esm";


  let webcontainer;
  let shellProcess;
  let shellInput;

  const terminalElement =
    document.getElementById("terminal");

  const status =
    document.getElementById("status");

  const preview =
    document.getElementById("preview");

  const previewFrame =
    document.getElementById("previewFrame");


  /*
   * XTERM TERMINAL
   */

  const terminal = new Terminal({

    convertEol: true,

    cursorBlink: true,

    fontSize: 14,

    fontFamily:
      "Consolas, Monaco, 'Courier New', monospace",

    theme: {
      background: "#0d1117",
      foreground: "#e6edf3",
      cursor: "#ffffff",
      selectionBackground: "#264f78"
    }

  });


  terminal.open(terminalElement);


  /*
   * START WEB CONTAINER
   */

  async function start() {

    try {

      status.textContent =
        "Booting WebContainer...";

      terminal.writeln(
        "\x1b[36mStarting WebContainer...\x1b[0m"
      );


      /*
       * ONLY ONE INSTANCE
       */

      webcontainer =
        await WebContainer.boot();


      status.textContent =
        "WebContainer ready";


      terminal.writeln(
        "\x1b[32m✓ WebContainer ready\x1b[0m"
      );

      terminal.writeln("");


      /*
       * SERVER READY
       */

      webcontainer.on(
        "server-ready",
        (port, url) => {

          status.textContent =
            "Server ready : " + port;

          preview.style.display =
            "flex";

          previewFrame.src =
            url;

          terminal.writeln("");

          terminal.writeln(
            "\x1b[32m✓ Server ready:\x1b[0m " +
            url
          );

        }
      );


      /*
       * START REAL INTERACTIVE SHELL
       */

      shellProcess =
        await webcontainer.spawn(
          "jsh",
          {
            terminal: {
              cols: terminal.cols,
              rows: terminal.rows
            }
          }
        );


      /*
       * WEBCONTAINER OUTPUT
       * -> XTERM
       */

      shellProcess.output.pipeTo(
        new WritableStream({

          write(data) {

            terminal.write(data);

          }

        })
      );


      /*
       * XTERM INPUT
       * -> WEBCONTAINER SHELL
       */

      shellInput =
        shellProcess.input.getWriter();


      terminal.onData(
        data => {

          shellInput.write(data);

        }
      );


      /*
       * RESIZE
       */

      terminal.onResize(
        ({ cols, rows }) => {

          if (shellProcess) {

            shellProcess.resize({
              cols,
              rows
            });

          }

        }
      );


      status.textContent =
        "Ready";


    } catch (error) {

      status.textContent =
        "Error";

      terminal.writeln("");

      terminal.writeln(
        "\x1b[31mWebContainer Error:\x1b[0m"
      );

      terminal.writeln(
        error.message
      );

      console.error(error);

    }

  }


  /*
   * SEND COMMAND
   *
   * IMPORTANT:
   * command new process mein nahi ja raha.
   * Same interactive shell mein ja raha hai.
   */

  window.sendCommand =
    function(command) {

      if (!shellInput) {

        terminal.writeln(
          "\x1b[31mShell not ready\x1b[0m"
        );

        return;

      }

      shellInput.write(
        command + "\r"
      );

    };


  /*
   * CTRL + C
   */

  window.sendCtrlC =
    function() {

      if (!shellInput) return;

      shellInput.write("\x03");

    };


  /*
   * PREVIEW
   */

  window.togglePreview =
    function() {

      if (
        preview.style.display === "flex"
      ) {

        preview.style.display =
          "none";

      } else {

        preview.style.display =
          "flex";

      }

    };


  /*
   * START
   */

  start();

</script>

</body>
</html>
